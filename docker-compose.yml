version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Bake base path into the Next.js bundle at build time (e.g. /ileads-qms)
        - NEXT_PUBLIC_BASE_PATH=/ileads-qms
    container_name: qms-app
    restart: always
    ports:
      - "3010:3010"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Connect to the local postgres container
      - DATABASE_URL=postgresql://ileads_qms_user:securepassword123@db:5432/ileads_qms?schema=public
      
      # App Security and Credentials
      - APP_SECRET=${APP_SECRET}
      - APP_PASSWORD=${APP_PASSWORD}
      
      # App Routing
      - NEXT_PUBLIC_BASE_PATH=/ileads-qms
      - APP_BASE_URL=http://localhost:3010/ileads-qms
      
      # Speech to Text Configuration (Sarvam uses the native Node SDK — no Python)
      - STT_PROVIDER=${STT_PROVIDER:-sarvam}
      - SARVAM_API_KEY=${SARVAM_API_KEY}
      - SARVAM_LANGUAGE_CODE=${SARVAM_LANGUAGE_CODE:-}
      - SARVAM_STT_MODEL=${SARVAM_STT_MODEL:-saaras:v3}
      - SARVAM_STT_MODE=${SARVAM_STT_MODE:-transcribe}
      - SARVAM_USE_PYTHON_ENGINE=${SARVAM_USE_PYTHON_ENGINE:-false}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - DEEPGRAM_MODEL=${DEEPGRAM_MODEL}
      - DEEPGRAM_LANGUAGE=${DEEPGRAM_LANGUAGE}
      - GEMINI_API_KEY=${GEMINI_API_KEY}

      # LLM Config
      - AUDIT_PROVIDER=${AUDIT_PROVIDER:-openrouter}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_AUDIT_MODEL=${OPENROUTER_AUDIT_MODEL}

      # Storage Config — set AUDIO_STORAGE_PROVIDER=s3 in your env to use S3.
      - AUDIO_STORAGE_PROVIDER=${AUDIO_STORAGE_PROVIDER:-local}
      - AUDIO_STORAGE_PATH=/app/storage/audio
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-ap-south-1}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-false}
      - S3_PUBLIC_BASE_URL=${S3_PUBLIC_BASE_URL:-}

      # Seed DB with Beetel/demo parameters on first run (optional)
      - RUN_DB_SEED=true
    volumes:
      # Only used when AUDIO_STORAGE_PROVIDER=local; ignored for S3.
      - qms-audio-storage:/app/storage/audio

  db:
    image: postgres:16-alpine
    container_name: qms-db
    restart: always
    environment:
      - POSTGRES_USER=ileads_qms_user
      - POSTGRES_PASSWORD=securepassword123
      - POSTGRES_DB=ileads_qms
    ports:
      # Exposed on host port 5433 to match default configuration and avoid conflicts
      - "5433:5432"
    volumes:
      - qms-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ileads_qms_user -d ileads_qms"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  qms-db-data:
  qms-audio-storage:
