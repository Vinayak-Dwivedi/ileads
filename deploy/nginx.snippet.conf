# Location-only snippet to add to an *existing* Nginx server { ... } block.
#
# Use this only if you already have a configured server block on :80 for
# 187.127.139.47 and don't want to replace it. Otherwise prefer the
# self-contained server block in deploy/nginx.conf.
#
# Inside your existing server { ... }, add:
#
#   include /etc/nginx/snippets/ileads-qms.conf;
#
# Where this file lives at /etc/nginx/snippets/ileads-qms.conf.

# Optional: bounce site root to the app.
location = / {
    return 302 /ileads-qms;
}

# Bare /ileads-qms (no trailing slash) — MUST be proxied, not redirected.
# Next.js strict-slash policy 308s "/ileads-qms/" back to "/ileads-qms";
# a 301 here would create an infinite loop.
location = /ileads-qms {
    proxy_pass http://127.0.0.1:3010;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_buffering off;
    proxy_redirect  off;
}

# Prefix-passthrough proxy. The Next.js app is built with basePath=/ileads-qms
# so it EXPECTS the prefix on every request, including /ileads-qms/_next/*.
location ^~ /ileads-qms/ {
    proxy_pass http://127.0.0.1:3010;   # no URI -> preserves $request_uri
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    proxy_buffering off;
    proxy_redirect  off;

    proxy_connect_timeout 30s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
}
