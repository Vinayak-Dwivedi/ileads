# Drop-in Nginx server block for the QMS app (subdomain deploy).
#
# Install (run on the host as root) — bootstrap-ec2.sh wires this up
# automatically and substitutes __SERVER_NAME__ from APP_BASE_URL in .env.
# The manual path is here for reference:
#
#   HOST=qms.example.com
#   sed "s|__SERVER_NAME__|$HOST|g" deploy/nginx.conf \
#     | sudo tee /etc/nginx/sites-available/ileads-qms.conf > /dev/null
#   sudo ln -sf /etc/nginx/sites-available/ileads-qms.conf /etc/nginx/sites-enabled/ileads-qms.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Architecture:
#   client (https) -> Cloudflare -> Nginx :80 -> http://127.0.0.1:3010
#                                                (Next.js prod started by PM2,
#                                                 NO basePath — the app is on
#                                                 a dedicated subdomain)
#
# Notes:
#   - server_name is templated; __SERVER_NAME__ is replaced at install time.
#   - X-Forwarded-Proto is HARDCODED to https. This is correct behind
#     Cloudflare (Flexible or Full): the public scheme is always https.
#     If you ever take Cloudflare out of the path, change this back to
#     $scheme and add a 443 server block with a real TLS cert.
#   - No `default_server` and no `/ileads-qms` location — this vhost only
#     answers for the configured server_name and proxies everything at root.
#   - For path-based deploys (no subdomain), see deploy/nginx.snippet.conf.

server {
    listen      80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # Larger so audio uploads / re-audit jobs work.
    client_max_body_size 200M;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket / HMR upgrades — harmless in production.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Streaming-friendly + don't rewrite upstream Location headers.
        proxy_buffering off;
        proxy_redirect  off;

        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
