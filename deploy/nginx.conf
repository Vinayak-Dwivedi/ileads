# Drop-in Nginx server block for the QMS app.
#
# Install (run on the host as root):
#   sudo bash /root/qms_demo/deploy/install-nginx-direct.sh
#
# Or manually:
#   sudo cp /root/qms_demo/deploy/nginx.conf /etc/nginx/sites-available/ileads-qms.conf
#   sudo ln -sf /etc/nginx/sites-available/ileads-qms.conf /etc/nginx/sites-enabled/ileads-qms.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Architecture:
#   client  ->  Nginx :80 (this file)  ->  http://127.0.0.1:3010
#                                          (Next.js prod started by PM2,
#                                           basePath=/ileads-qms baked in
#                                           at build time)
#
# Key invariants — DO NOT BREAK:
#   - Next.js is built with basePath=/ileads-qms, so the upstream EXPECTS the
#     "/ileads-qms" prefix in the request URI. We use a prefix-less proxy_pass
#     (no trailing path) so $request_uri is forwarded verbatim. Adding a path
#     to proxy_pass (e.g. "http://127.0.0.1:3010/") would strip the prefix
#     and break routing.
#   - `location ^~ /ileads-qms/` wins over any regex location and over
#     shorter prefixes, so static asset locations defined elsewhere can't
#     steal /ileads-qms/_next/... requests.
#   - `location = /ileads-qms` (exact, no trailing slash) ALSO proxies to
#     the upstream — it MUST NOT 301 to /ileads-qms/ because Next's strict
#     trailing-slash policy then 308s back to /ileads-qms and we'd loop.
#     The upstream answers /ileads-qms with 307 -> /ileads-qms/dashboard.

# Re-usable proxy params kept in a map so the two locations below stay
# in sync. (Defined via inline duplication rather than a separate file so
# operators don't need to install snippets.)

server {
    listen      80 default_server;
    listen [::]:80 default_server;
    server_name 187.127.139.47 _;

    # Larger so future audio uploads / re-audit jobs work.
    client_max_body_size 200M;

    # Optional convenience: bounce site root to the app.
    location = / {
        return 302 /ileads-qms;
    }

    # 1. Bare /ileads-qms (no trailing slash) — proxy, do NOT redirect.
    location = /ileads-qms {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_buffering off;
        proxy_redirect  off;
    }

    # 2. Everything under /ileads-qms/* — proxy with prefix preserved.
    location ^~ /ileads-qms/ {
        # No URI on proxy_pass => $request_uri is forwarded as-is, so the
        # "/ileads-qms" prefix is preserved.
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket / HMR upgrades — harmless in production, useful if you
        # ever flip on Next's dev server behind the same proxy.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Streaming-friendly + don't rewrite upstream Location headers.
        proxy_buffering off;
        proxy_redirect  off;

        # Slightly longer timeouts to survive cold next/image responses and
        # the mock audit pipeline's transaction.
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
